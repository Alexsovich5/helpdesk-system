name: helpdesk-system

services:
  app:
    build: .
    image: helpdesk-system:app
    ports:
      - "20680:80"
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_DATABASE: helpdesk
      DB_USERNAME: helpdesk
      DB_PASSWORD: helpdesk
      MAIL_HOST: smtp-sink
      MAIL_PORT: "1025"
    volumes:
      - mail-sink:/var/mail-sink
    depends_on:
      db:
        condition: service_healthy
      smtp-sink:
        condition: service_healthy

  db:
    image: mysql:5.6
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: helpdesk
      MYSQL_USER: helpdesk
      MYSQL_PASSWORD: helpdesk
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Runs sla:check once a minute against the helpdesk database.
  scheduler:
    image: helpdesk-system:app
    command: ["sh", "-c", "while true; do php artisan sla:check; sleep 60; done"]
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_DATABASE: helpdesk
      DB_USERNAME: helpdesk
      DB_PASSWORD: helpdesk
      MAIL_HOST: smtp-sink
      MAIL_PORT: "1025"
    volumes:
      - mail-sink:/var/mail-sink
    depends_on:
      db:
        condition: service_healthy
      smtp-sink:
        condition: service_healthy

  # Runs PHPUnit. Unit and functional suites use sqlite in memory;
  # the integration suite uses the helpdesk_test database on db.
  test:
    image: helpdesk-system:app
    profiles: ["test"]
    environment:
      DB_HOST: db
      DB_DATABASE: helpdesk
      DB_TEST_DATABASE: helpdesk_test
      DB_USERNAME: helpdesk
      DB_PASSWORD: helpdesk
      APP_KEY: LocalSampleKeyForHelpdeskStack32
      LDAP_HOST: ldap
      MAIL_HOST: smtp-sink
      MAIL_PORT: "1025"
      MAIL_SINK_DIR: /var/mail-sink
    volumes:
      - mail-sink:/var/mail-sink

  # OpenLDAP directory standing in for Active Directory (docker/ldap).
  ldap:
    build: ./docker/ldap
    image: helpdesk-system:ldap
    platform: linux/amd64
    volumes:
      - ldap-data:/var/lib/ldap
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://127.0.0.1", "-b", "dc=helpdesk,dc=local", "-s", "base"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Fake SMTP server: writes every message to the mail-sink volume as a
  # .eml file (docker/smtp-sink). Nothing is relayed.
  smtp-sink:
    build: ./docker/smtp-sink
    image: helpdesk-system:smtp-sink
    volumes:
      - mail-sink:/var/mail-sink
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 1025), 2).close()"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  db-data:
  ldap-data:
  mail-sink:

networks:
  default:
    ipam:
      config:
        - subnet: 172.46.0.0/24
